name: Burrow
# Builds Burrow (elfuse + burrow/patches) on a Mac and the test programs on Linux ARM64, where they also run natively
# to compare. GitHub's Macs are virtual machines and can't use the Hypervisor framework: there Burrow is only built,
# and the test runs on a real Mac (the «burrow-prueba» artifact has everything).
on:
  push:
    branches: [main]
    paths: ['burrow/**', '.github/workflows/burrow.yml']
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Test programs
        run: |
          set -e
          mkdir -p out/root/lib/aarch64-linux-gnu
          gcc -O2 -static -o out/prueba-static burrow/tests/prueba.c
          gcc -O2 -o out/prueba-dynamic burrow/tests/prueba.c
          gcc -O2 -pthread -o out/root/hilos burrow/tests/hilos.c
          sudo apt-get install -y -qq busybox-static > /dev/null && cp /bin/busybox out/busybox
          # A minimal Linux for the dynamic one: its loader and libc, where it looks for them
          cp -L /lib/ld-linux-aarch64.so.1 out/root/lib/
          cp -L /lib/aarch64-linux-gnu/libc.so.6 out/root/lib/aarch64-linux-gnu/
          cp out/prueba-dynamic out/root/prueba
          file out/prueba-static out/prueba-dynamic
          for p in out/prueba-static out/prueba-dynamic; do env -u TMPDIR BURROW_TEST=madriguera $p uno dos | tee "$p.esperado"; done
          out/root/hilos | tee out/hilos.esperado
      - name: GPU test system (Mesa Venus, vulkaninfo, vkcube)
        run: bash burrow/gpu/sysroot-linux.sh "$PWD/out/gpu-root"
      - uses: actions/upload-artifact@v4
        with: { name: burrow-tests, path: out, retention-days: 30 }
  mac:
    needs: linux
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          brew install binutils > /dev/null
          bash burrow/build.sh 2> err.txt || { grep -m20 "error" err.txt | while read -r l; do echo "::error::$l"; done; cat err.txt; exit 1; }
          grep -m20 "warning" err.txt | while read -r l; do echo "::warning::$l"; done || true
      - name: GPU, Mac side (virglrenderer with Venus + MoltenVK)
        run: |
          brew install meson ninja pkg-config libepoxy molten-vk > /dev/null
          bash burrow/gpu/build-virgl.sh
          v=burrow/build/virgl
          clang -O2 -o "$v/virgl-prueba" burrow/gpu/virgl-prueba.c -I"$v/include/virgl" -L"$v/lib" -lvirglrenderer -Wl,-rpath,@executable_path/lib
          DYLD_LIBRARY_PATH="$v/lib:$(brew --prefix)/lib" "$v/virgl-prueba" | tee virgl.txt || true
          grep -q 'VIRGL: TODO BIEN' virgl.txt && echo "::notice::GPU: virglrenderer + Venus + MoltenVK start on this Mac ($(grep capset virgl.txt))" \
            || echo "::warning::GPU: virglrenderer + Venus didn't start on this GitHub Mac (no real GPU?)"
      - uses: actions/download-artifact@v4
        with: { name: burrow-tests, path: tests }
      - name: Run (if this Mac allows the Hypervisor framework)
        run: |
          chmod +x tests/prueba-* tests/root/prueba tests/root/hilos tests/busybox
          if [ "$(sysctl -n kern.hv_support 2>/dev/null)" != 1 ]; then
            echo "::warning::This GitHub Mac has no Hypervisor framework: Burrow is built but not run here"; exit 0
          fi
          export BURROW_TEST=madriguera
          r=0
          burrow/build/elfuse tests/prueba-static uno dos > s.txt 2>&1 || r=1; cat s.txt
          burrow/build/elfuse --sysroot tests/root tests/root/prueba uno dos > d.txt 2>&1 || r=1; cat d.txt
          diff tests/prueba-static.esperado s.txt && diff tests/prueba-dynamic.esperado d.txt || r=1
          [ $r = 0 ] && echo "::notice::Burrow: the test programs run the same as on Linux" || { echo "::error::Burrow: the tests don't match Linux"; exit 1; }
      - name: Package for a real Mac
        run: |
          mkdir -p pkg/lib && cp burrow/build/elfuse pkg/
          # GPU: virglrenderer and what it needs from Homebrew (MoltenVK, libepoxy), next to the test program
          cp burrow/build/virgl/virgl-prueba pkg/ && cp -L burrow/build/virgl/lib/libvirglrenderer*.dylib pkg/lib/
          cp -L "$(brew --prefix)/lib/libMoltenVK.dylib" "$(brew --prefix)/lib/libepoxy.0.dylib" pkg/lib/
          # (they look for each other next to the program, not in Homebrew; then signed again)
          for f in pkg/lib/*.dylib; do chmod u+w "$f"; install_name_tool -id "@rpath/$(basename "$f")" "$f" 2>/dev/null; done
          for f in pkg/virgl-prueba pkg/lib/*.dylib; do
            for dep in $(otool -L "$f" | awk 'NR>1 {print $1}' | grep -E 'virglrenderer|MoltenVK|epoxy'); do
              install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$f" 2>/dev/null
            done
            install_name_tool -add_rpath @loader_path "$f" 2>/dev/null || true
            codesign -f -s - "$f"
          done
          otool -L pkg/virgl-prueba pkg/lib/*.dylib | grep -v ':$' | sort -u && cp burrow/tests/probar.sh pkg/ && cp -R tests/. pkg/ && chmod +x pkg/elfuse pkg/probar.sh pkg/prueba-* pkg/busybox pkg/root/prueba pkg/root/hilos
          tar -czf burrow-prueba.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with: { name: burrow-prueba, path: burrow-prueba.tar.gz, retention-days: 30 }
