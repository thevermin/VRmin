name: Wine con msync para VRmin

# El Wine que instala instalar_motor.sh (wine-devel 11.8 de Gcenx, el de WineHQ) no tiene msync: toda la sincronización
# entre programas de Windows (eventos, mutex, semáforos) pasa por wineserver, que hace una cosa a la vez. msync
# (Marc-Aurel Zent, el de CrossOver) la hace con memoria compartida y semáforos de Mach, sin pasar por wineserver.
# mac/wine/msync.patch: msync de CrossOver 26.3 (Wine 11.0, como forma de los «inproc sync» de Wine 11) sobre Wine 11.8.
# Se aplican todos los mac/wine/*.patch (por orden) y se compila solo lo que cambian (mac/wine/archivos.txt), con las
# mismas opciones que la compilación de Gcenx; eso se reemplaza en el motor (el resto de Wine queda igual).
# msync se activa con WINEMSYNC=1 (entorno.sh).
# Sin -fvisibility=hidden, como la de Gcenx: DXMT y otros buscan funciones internas de win32u.so y winemac.so por nombre.
# mac/wine/vulkan-metal.patch: VK_KHR_external_memory_win32 y VK_KHR_win32_keyed_mutex sobre las texturas de Metal de
# MoltenVK (para que un juego Vulkan le pase sus imágenes a SteamVR real, que las comparte con DXMT), en win32u.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mac/wine/**', '.github/workflows/wine.yml']

env:
  WINE_VERSION: '11.8'
  GCENX_URL: https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.8/wine-devel-11.8-osx64.tar.xz
  GCENX_SHA: 5c9f0984961ee6289f4f2c4fe751c27f02b6c28855154e3f99b7e2bd8108b620

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { path: vrmin }
      - name: Herramientas (Rosetta, bison, llvm-mingw)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          brew install bison >/dev/null
          url=$(gh api repos/mstorsjo/llvm-mingw/releases/latest --jq '.assets[]|select(.name|test("ucrt-macos-universal.tar.xz$"))|.browser_download_url')
          echo "llvm-mingw: $url"
          mkdir -p llvm-mingw && curl -sSL "$url" | tar -xJ -C llvm-mingw --strip-components 1
      - name: Código de Wine 11.8 + parches de VRmin
        run: |
          curl -sSL -o wine.tar.xz "https://dl.winehq.org/wine/source/11.x/wine-$WINE_VERSION.tar.xz"
          shasum -a 256 wine.tar.xz
          tar -xJf wine.tar.xz && mv "wine-$WINE_VERSION" wine
          cd wine && for p in ../vrmin/mac/wine/*.patch; do echo "== $p"; patch -p1 < "$p"; done
          grep -v '^#' ../vrmin/mac/wine/archivos.txt | grep . > ../archivos.txt
      - name: libinotify (la misma de la compilación de Gcenx; wineserver la usa)
        run: |
          curl -sSL -o gcenx.tar.xz "$GCENX_URL"
          echo "$GCENX_SHA  gcenx.tar.xz" | shasum -a 256 -c -
          mkdir gcenx && tar -xJf gcenx.tar.xz -C gcenx
          G="gcenx/Wine Devel.app/Contents/Resources/wine"
          mkdir -p inotify/lib inotify/include/sys
          cp "$G/lib/libinotify.0.dylib" inotify/lib/ && ln -s libinotify.0.dylib inotify/lib/libinotify.dylib
          # (MoltenVK de la de Gcenx, para que configure active Vulkan como en la suya: win32u y winemac.drv la cargan)
          cp "$G/lib/libMoltenVK.dylib" inotify/lib/
          git clone -q --depth 1 https://github.com/libinotify-kqueue/libinotify-kqueue.git inotify/src
          cp inotify/src/sys/inotify.h inotify/include/sys/
          mkdir gcenx-orig   # (para comparar)
          while read -r src dst; do cp "$G/$dst" gcenx-orig/ 2>/dev/null || true; done < archivos.txt
      - name: Configurar (x86_64, con Rosetta; opciones de Gcenx)
        working-directory: wine
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH:$PWD/../llvm-mingw/bin" MACOSX_DEPLOYMENT_TARGET=10.15
          I="$PWD/../inotify"
          arch -x86_64 ./configure --build=x86_64-apple-darwin --enable-archs=i386,x86_64 --disable-tests \
            --disable-winebth_sys --with-mingw="$PWD/../llvm-mingw/bin/clang" --with-inotify --with-pthread \
            --without-alsa --without-capi --without-coreaudio --without-cups --without-dbus --without-ffmpeg \
            --without-freetype --without-gettext --without-gettextpo --without-gphoto --without-gnutls \
            --without-gssapi --without-gstreamer --without-krb5 --without-netapi --without-opencl \
            --without-opengl --without-oss --without-pcap --without-pcsclite --without-pulse --without-sane \
            --without-sdl --without-udev --without-usb --without-v4l2 \
            --without-wayland --without-x \
            CC="/usr/bin/clang -arch x86_64" CPPFLAGS="-I$I/include" LDFLAGS="-L$I/lib" \
            ac_cv_cflags__fvisibility_hidden=no > ../configure.log 2>&1 \
            || { tail -60 ../configure.log; exit 1; }
          grep -E "HAVE_SYS_INOTIFY_H|SONAME_|HAVE_LINUX_NTSYNC" include/config.h | head
          # (Vulkan: el mismo nombre que en la de Gcenx, sin ruta; Wine la encuentra en su carpeta lib)
          grep -q 'define SONAME_LIBVULKAN' include/config.h || { echo "::error::configure no encontró MoltenVK"; grep -i vulkan ../configure.log | tail; exit 1; }
          sed -i '' 's|^#define SONAME_LIBVULKAN .*|#define SONAME_LIBVULKAN "libMoltenVK.dylib"|' include/config.h
          grep SONAME_LIBVULKAN include/config.h
      - name: Compilar lo que cambian los parches
        working-directory: wine
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH:$PWD/../llvm-mingw/bin" MACOSX_DEPLOYMENT_TARGET=10.15
          arch -x86_64 make -j"$(sysctl -n hw.ncpu)" $(awk '{print $1}' ../archivos.txt) > ../make.log 2>&1 \
            || { grep -E "error|Error" -A3 ../make.log | head -80; exit 1; }
          grep -i "warning:.*msync" ../make.log | head -20 || true
      - name: Revisar (bibliotecas y funciones iguales a las de Gcenx, más las de msync)
        run: |
          while read -r src dst; do
            n="wine/$src"; f="gcenx-orig/${dst##*/}"
            echo "== $dst"; file "$n"; otool -L "$n" 2>/dev/null; otool -l "$n" 2>/dev/null | grep -A2 LC_RPATH | grep path || true
            [ -f "$f" ] || { echo "(nuevo, no está en el de Gcenx)"; continue; }
            nm -gU "$f" 2>/dev/null | awk '{print $3}' | sort > a.txt; nm -gU "$n" 2>/dev/null | awk '{print $3}' | sort > b.txt
            echo "solo en Gcenx:"; comm -23 a.txt b.txt; echo "solo en la nuestra:"; comm -13 a.txt b.txt
          done < archivos.txt
          strings -a wine/dlls/ntdll/ntdll.so | grep -q "WINEMSYNC" && echo "msync: sí"
          # (con sus funciones internas a la vista, como la de Gcenx: DXMT busca add_window_client_surface por nombre)
          nm -gU wine/dlls/win32u/win32u.so | grep -q ' _add_window_client_surface$' && echo "win32u.so: funciones internas a la vista, como la de Gcenx" \
            || { echo "::error::win32u.so esconde sus funciones internas (DXMT no podría crear sus ventanas)"; exit 1; }
          strings -a wine/dlls/win32u/win32u.so | grep -qx "libMoltenVK.dylib" && strings -a wine/dlls/win32u/win32u.so | grep -q "DXMT_shared_resource_" \
            && echo "Vulkan con texturas de DXMT: sí" || { echo "::error::win32u.so sin MoltenVK o sin el parche de Vulkan"; exit 1; }
      - name: Empaquetar
        run: |
          while read -r src dst; do mkdir -p "out/$(dirname "$dst")" && cp "wine/$src" "out/$dst"; done < archivos.txt
          # (libinotify como en la de Gcenx: @rpath/libinotify.0.dylib, buscada en ../lib)
          install_name_tool -change libinotify.dylib @rpath/libinotify.0.dylib out/bin/wineserver
          otool -l out/bin/wineserver | grep -q "@loader_path/../lib" || install_name_tool -add_rpath @loader_path/../lib out/bin/wineserver
          otool -L out/bin/wineserver | grep -q "@rpath/libinotify.0.dylib" || { echo "wineserver sin libinotify"; exit 1; }
          find out -type f \( -name '*.so' -o -path 'out/bin/*' \) -exec codesign --force --sign - {} +
          echo "wine $WINE_VERSION + msync ($(cd vrmin && git rev-parse --short HEAD))" > out/version
          tar -czf wine-msync-vrmin.tar.gz -C out .
          shasum -a 256 wine-msync-vrmin.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wine-msync-vrmin
          path: wine-msync-vrmin.tar.gz
          retention-days: 30
