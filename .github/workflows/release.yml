name: Publicar versión
# Arma la versión en GitHub (como borrador) con la app del Quest que compiló «App del Quest» en main y VRmin para
# Windows («VRmin para Windows»)
# (las notas salen de docs/releases/<etiqueta>.md).
# La app de Mac NO sale de acá: se arma en la Mac de VRmin con «bash crear_app.sh --paquete» (firmada con el
# certificado fijo de VRmin; el actualizador de VRmin Host rechaza otra firma) y se sube a mano al borrador antes
# de publicarlo. Al publicarlo, «Revisar la versión publicada» comprueba que esté todo bien.
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Etiqueta (por ejemplo v0.47)', required: true }
      beta: { description: 'Beta (pre-release)', type: boolean, default: false }
      draft: { description: 'Borrador (se revisa y se publica a mano)', type: boolean, default: true }
      sin_mac: { description: 'Sin la app de Mac de GitHub (lo normal: la firmada se sube a mano)', type: boolean, default: true }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Bajar lo compilado
        run: |
          set -e
          mac=$(gh run list -R "$GITHUB_REPOSITORY" --workflow mac.yml --branch main --limit 10 --json databaseId,conclusion -q '[.[] | select(.conclusion == "success")][0].databaseId')
          apk=$(gh run list -R "$GITHUB_REPOSITORY" --workflow quest-app.yml --branch main --limit 10 --json databaseId,conclusion -q '[.[] | select(.conclusion == "success")][0].databaseId')
          echo "App de Mac: $mac · App del Quest: $apk"
          [ "${{ inputs.sin_mac }}" = "true" ] || gh run download "$mac" -R "$GITHUB_REPOSITORY" -n VRmin-Host-mac -D out
          gh run download "$apk" -R "$GITHUB_REPOSITORY" -n VRmin-quest-apk -D out
          # VRmin para Windows (si ya hay uno compilado)
          win=$(gh run list -R "$GITHUB_REPOSITORY" --workflow windows.yml --branch main --limit 10 --json databaseId,conclusion -q '[.[] | select(.conclusion == "success")][0].databaseId')
          [ -n "$win" ] && gh run download "$win" -R "$GITHUB_REPOSITORY" -n VRmin-Windows -D out || echo "Sin VRmin para Windows"
          # El DXMT que baja instalar_motor.sh, si lo pide de esta versión: el último compilado («DXMT para VRmin»),
          # solo si es exactamente el que espera (su SHA-256)
          url=$(grep -o '^DXMT_URL="[^"]*' mac/app/recursos/instalar_motor.sh | sed 's/^DXMT_URL="//')
          if [ "${url%/*}" = "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ inputs.tag }}" ]; then
            sha=$(grep -o '^DXMT_SHA="[^"]*' mac/app/recursos/instalar_motor.sh | sed 's/^DXMT_SHA="//')
            dx=$(gh run list -R "$GITHUB_REPOSITORY" --workflow dxmt.yml --branch main --limit 10 --json databaseId,conclusion -q '[.[] | select(.conclusion == "success")][0].databaseId')
            gh run download "$dx" -R "$GITHUB_REPOSITORY" -n dxmt-vrmin -D dxmt
            echo "$sha  dxmt/dxmt-vrmin.tar.gz" | sha256sum -c -
            cp dxmt/dxmt-vrmin.tar.gz "out/${url##*/}"
          fi
          ls -la out
      - name: Publicar
        run: |
          set -e
          notes="docs/releases/${{ inputs.tag }}.md"
          test -f "$notes"
          title=$(head -1 "$notes" | sed 's/^## *//')
          flag=""; [ "${{ inputs.beta }}" = "true" ] && flag="--prerelease"
          [ "${{ inputs.draft }}" = "true" ] && flag="$flag --draft"
          # Si ya hay un borrador con esa etiqueta, se actualiza (notas y archivos nuevos; lo que se subió a mano queda)
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" -q '.[] | select(.draft and .tag_name == "${{ inputs.tag }}") | .id' | head -1)
          if [ -n "$draft" ]; then
            gh release upload "${{ inputs.tag }}" out/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes"
            echo "Borrador ${{ inputs.tag }} actualizado"
          else
            gh release create "${{ inputs.tag }}" out/* -R "$GITHUB_REPOSITORY" --target main --title "$title" --notes-file "$notes" $flag
          fi
