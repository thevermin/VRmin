name: Página web
# Publica site/ (con las imágenes de docs/media) en GitHub Pages: thevermin.github.io/VRmin
# (hace falta una vez: Settings › Pages › Source: «GitHub Actions»)
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/media/**', 'mac/app/AppIcon.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Armar
        run: |
          mkdir -p out/media
          cp site/index.html out/
          cp docs/media/* out/media/
          cp mac/app/AppIcon.png out/media/icon.png
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: d
        uses: actions/deploy-pages@v4
