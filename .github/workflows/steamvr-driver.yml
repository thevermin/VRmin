name: Driver de SteamVR
# Builds driver_vrmin.dll (mac/steamvr) with mingw and keeps it in the repo, like the OpenXR runtime.
on:
  push:
    branches: [main]
    paths: ['mac/steamvr/*.cpp', '.github/workflows/steamvr-driver.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64 and OpenVR's headers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix >/dev/null
          git clone -q https://github.com/ValveSoftware/openvr.git "$RUNNER_TEMP/openvr"
          git -C "$RUNNER_TEMP/openvr" checkout -q 0924064316de3effbcd1acf1e309182a2deb1c05
      - name: Build
        run: |
          x86_64-w64-mingw32-g++-posix -std=c++17 -O2 -Wall -shared -o "$RUNNER_TEMP/driver_vrmin.dll" mac/steamvr/driver_vrmin.cpp \
            -I"$RUNNER_TEMP/openvr/headers" -static -static-libgcc -static-libstdc++ -ld3d11 -ldxgi -lws2_32 -ldxguid > build.log 2>&1 || true
          grep -E "error|warning" build.log | head -20 | while IFS= read -r l; do echo "::warning::$l"; done
          test -f "$RUNNER_TEMP/driver_vrmin.dll"
          x86_64-w64-mingw32-objdump -p "$RUNNER_TEMP/driver_vrmin.dll" | grep -q HmdDriverFactory
      - uses: actions/upload-artifact@v4
        with: { name: driver_vrmin, path: '${{ runner.temp }}/driver_vrmin.dll', retention-days: 7 }
      - name: Keep the DLL in the repository
        if: github.event_name == 'push'
        run: |
          mkdir -p mac/steamvr/driver_vrmin/bin/win64 && cp "$RUNNER_TEMP/driver_vrmin.dll" mac/steamvr/driver_vrmin/bin/win64/driver_vrmin.dll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mac/steamvr/driver_vrmin/bin/win64/driver_vrmin.dll
          git commit -qm "Build the SteamVR driver DLL" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
