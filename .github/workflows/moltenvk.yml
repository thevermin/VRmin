name: MoltenVK para VRmin

# MoltenVK (Vulkan → Metal) compilado desde el código, como el de steamac (fxgl/steamac, host/moltenvk/build.sh): el
# fork de UTM (MoltenVK 1.4.1, la misma versión que trae el Wine de Gcenx, con geometry shaders de verdad,
# robustness2 y transform feedback) con los arreglos de steamac para juegos (mac/moltenvk/steamac/: MoltenVK y su
# SPIRV-Cross). Sale moltenvk-vrmin.tar.gz con lib/libMoltenVK.dylib (x86_64, como el Wine) para el motor de VRmin.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mac/moltenvk/**', '.github/workflows/moltenvk.yml']

env:
  MVK_REPO: https://github.com/utmapp/MoltenVK.git
  MVK_COMMIT: 05604465d691118cfd20f53a48ecf1aad9c12f93
  SPVC_REPO: https://github.com/utmapp/SPIRV-Cross.git
  SPVC_COMMIT: 939b40b33a44443c404c4078823c406e3c94866f

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: vrmin
      - name: Xcode (el más nuevo que haya: los geometry shaders usan mesh shaders de Metal)
        run: |
          x=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Xcode: $x"; sudo xcode-select -s "$x"; xcodebuild -version; xcrun --find metal
      - name: Código (los commits fijos de steamac) y arreglos
        run: |
          set -e
          fetch() { git init -q "$1"; git -C "$1" remote add origin "$2"; git -C "$1" fetch -q --depth 1 origin "$3"; git -C "$1" checkout -q -f --detach "$3"; }
          fetch spvc "$SPVC_REPO" "$SPVC_COMMIT"
          for p in vrmin/mac/moltenvk/steamac/spirv-cross/*.patch; do git -C spvc apply "$GITHUB_WORKSPACE/$p"; done
          fetch mvk "$MVK_REPO" "$MVK_COMMIT"
          test "$(cat mvk/ExternalRevisions/SPIRV-Cross_repo_revision)" = "$SPVC_COMMIT"
          for p in vrmin/mac/moltenvk/steamac/moltenvk/*.patch; do git -C mvk apply "$GITHUB_WORKSPACE/$p"; done
          # (la revisión de los arreglos va en el pipelineCacheUUID: los cachés de shaders de otra versión no se usan)
          rev=$(cat vrmin/mac/moltenvk/steamac/moltenvk/*.patch vrmin/mac/moltenvk/steamac/spirv-cross/*.patch | shasum -a 256 | cut -c1-8)
          printf '// Generated by VRmin moltenvk.yml\n#define MVK_PATCH_REVISION 0x%s\n' "$rev" > mvk/MoltenVK/MoltenVK/GPUObjects/MVKPatchRevision.h
      - name: Dependencias
        working-directory: mvk
        run: env -i PATH="$PATH" HOME="$HOME" LANG=en_US.UTF-8 ./fetchDependencies --macos --spirv-cross-root "$GITHUB_WORKSPACE/spvc"
      - name: MoltenVK
        working-directory: mvk
        run: env -i PATH="$PATH" HOME="$HOME" LANG=en_US.UTF-8 make macos
      - name: Paquete
        run: |
          set -e
          built=mvk/Package/Release/MoltenVK/dynamic/dylib/macOS
          mkdir -p pkg/lib
          lipo "$built/libMoltenVK.dylib" -thin x86_64 -output pkg/lib/libMoltenVK.dylib
          codesign --force -s - pkg/lib/libMoltenVK.dylib
          lipo -info pkg/lib/libMoltenVK.dylib; otool -D pkg/lib/libMoltenVK.dylib
          strings pkg/lib/libMoltenVK.dylib | grep -q vkSetMTLTextureMVK   # (lo usa el Wine de VRmin)
          cp mvk/LICENSE pkg/LICENSE-MoltenVK.txt
          cp vrmin/mac/moltenvk/steamac/README.md pkg/README-steamac.md
          echo "MoltenVK $MVK_REPO@$MVK_COMMIT + SPIRV-Cross $SPVC_REPO@$SPVC_COMMIT + steamac mac/moltenvk/steamac/" > pkg/VERSION.txt
          tar -czf moltenvk-vrmin.tar.gz -C pkg .
          shasum -a 256 moltenvk-vrmin.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: moltenvk-vrmin
          path: moltenvk-vrmin.tar.gz
