name: Mover etiquetas
# Mueve etiquetas de versión a otros commits (entrada: "v0.48=<sha> v0.49=<sha> ...")
on:
  workflow_dispatch:
    inputs:
      tags: { description: 'etiqueta=commit separadas por espacios', required: true }
permissions: { contents: write }
jobs:
  mover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Mover
        run: |
          set -e
          for p in ${{ inputs.tags }}; do
            t=${p%%=*}; s=${p#*=}
            git cat-file -e "$s^{commit}"
            git push -f origin "$s:refs/tags/$t"
            echo "$t -> $s"
          done
