name: Explorar DX12 (KosmicKrisp x86_64)
on:
  push:
    branches: [explorar-dx12]
jobs:
  vkd3d:
    # vkd3d-proton con mac/dx12/vkd3d-proton.patch (lo que le falta a KosmicKrisp, como aviso y no como error)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: vrmin }
      - name: Compilar
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y glslang-tools ninja-build >/dev/null
          pip install -q --break-system-packages meson
          # (el MinGW de Ubuntu es viejo para vkd3d-proton: llvm-mingw, el mismo de wine.yml)
          url=$(gh api repos/mstorsjo/llvm-mingw/releases/latest --jq '.assets[]|select(.name|test("ucrt-ubuntu-[0-9.]+-x86_64.tar.xz$"))|.browser_download_url' | head -1)
          mkdir lm && curl -sSL "$url" | tar -xJ -C lm --strip-components 1
          export PATH="$PWD/lm/bin:$PATH"
          printf "%s\n" "[binaries]" "c = 'x86_64-w64-mingw32-clang'" "cpp = 'x86_64-w64-mingw32-clang++'" "ar = 'x86_64-w64-mingw32-ar'" \
            "strip = 'x86_64-w64-mingw32-strip'" "widl = 'x86_64-w64-mingw32-widl'" "windres = 'x86_64-w64-mingw32-windres'" \
            "[host_machine]" "system = 'windows'" "cpu_family = 'x86_64'" "cpu = 'x86_64'" "endian = 'little'" > $PWD/lm.txt
          git clone -q --recursive https://github.com/HansKristian-Work/vkd3d-proton.git v && cd v
          git checkout -q bfdb811c6d7ccd8c6151f19532654b063a6631f2 && git submodule -q update --init --recursive
          git apply ../vrmin/mac/dx12/vkd3d-proton.patch
          meson setup --cross-file ../lm.txt --buildtype release -Denable_tests=false b64 > ../m.log 2>&1 || { tail -40 ../m.log; exit 1; }
          ninja -C b64 > ../n.log 2>&1 || { grep -B2 -A6 error ../n.log | head -50; exit 1; }
          mkdir -p ../out && cp $(find b64 -name 'd3d12.dll' -o -name 'd3d12core.dll') ../out/ && ls -la ../out
      - name: dxgi de DXVK (para las ventanas de vkd3d-proton), con mac/dx12/dxvk-dxgi.patch
        timeout-minutes: 25
        run: |
          # (con el MinGW de Ubuntu, como compila DXVK; con la libc++ nueva de llvm-mingw no compila)
          echo "== apt"; sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get -qq install -y mingw-w64 >/dev/null
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          echo "== clone"; timeout 300 git clone -q --recursive -b v2.7.1 https://github.com/doitsujin/dxvk.git dx && cd dx
          echo "== build"
          git apply ../vrmin/mac/dx12/dxvk-dxgi.patch
          meson setup --cross-file build-win64.txt --buildtype release b64 > ../dm.log 2>&1 || { tail -40 ../dm.log; exit 1; }
          ninja -C b64 src/dxgi/dxgi.dll > ../dn.log 2>&1 || { grep -B2 -A6 error ../dn.log | head -50; exit 1; }
          cp b64/src/dxgi/dxgi.dll ../out/ && ls -la ../out
      - uses: actions/upload-artifact@v4
        with: { name: vkd3d-proton-vrmin, path: out, retention-days: 14 }
  kk:
    if: false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { path: vrmin }
      - name: Herramientas
        run: |
          brew install meson ninja pkg-config llvm libclc spirv-llvm-translator spirv-tools bison flex mingw-w64 zstd >/dev/null
          python3 -m venv venv && venv/bin/pip -q install mako packaging pyyaml meson
      - name: Mesa
        run: |
          t=$(git ls-remote --tags https://gitlab.freedesktop.org/mesa/mesa.git 'mesa-26.*' | grep -v '\^{}' | grep -v -- '-rc' | awk -F/ '{print $3}' | sort -V | tail -1)
          echo "tag: $t"; git clone -q --depth 1 -b "$t" https://gitlab.freedesktop.org/mesa/mesa.git mesa
      - name: Nativo (las herramientas de compilación)
        working-directory: mesa
        run: |
          export PATH="$PWD/../venv/bin:$(brew --prefix llvm)/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          meson setup nat --prefix="$PWD/../nat" -Dbuildtype=release -Dplatforms=macos -Dvulkan-drivers=kosmickrisp \
            -Dgallium-drivers= -Dopengl=false -Dzstd=disabled -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true > ../nat.log 2>&1 || { tail -40 ../nat.log; exit 1; }
          ninja -C nat install > ../natb.log 2>&1 || { grep -B2 -A8 "error" ../natb.log | head -60; exit 1; }
      - name: KosmicKrisp x86_64
        working-directory: mesa
        run: |
          export PATH="$PWD/../nat/bin:$PWD/../venv/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          printf "%s\n" "[binaries]" "c = ['clang', '-arch', 'x86_64']" "cpp = ['clang++', '-arch', 'x86_64']" \
            "objc = ['clang', '-arch', 'x86_64']" "objcpp = ['clang++', '-arch', 'x86_64']" "ar = 'ar'" "strip = 'strip'" \
            "pkg-config = 'false'" "[host_machine]" "system = 'darwin'" "cpu_family = 'x86_64'" "cpu = 'x86_64'" "endian = 'little'" > x86.txt
          meson setup x86 --cross-file x86.txt --prefix="$PWD/../x86" -Dbuildtype=release -Dplatforms=macos \
            -Dvulkan-drivers=kosmickrisp -Dgallium-drivers= -Dopengl=false -Dzstd=disabled -Dmesa-clc=system \
            -Dprecomp-compiler=system -Dllvm=disabled -Dexpat=disabled > ../x86.log 2>&1 || { tail -60 ../x86.log; exit 1; }
          ninja -C x86 install > ../x86b.log 2>&1 || { grep -B2 -A10 "error" ../x86b.log | head -80; exit 1; }
          echo "mesa $(git describe --tags 2>/dev/null || git rev-parse --short HEAD)" > ../kk-version
      - name: Cargador de Vulkan y vulkaninfo (Vulkan SDK de LunarG, universales)
        run: |
          curl -sSL -o sdk.zip "https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.zip" && unzip -q sdk.zip -d sdk
          app=$(find sdk -maxdepth 2 -name '*.app' | head -1)
          "$app/Contents/MacOS/$(basename "$app" .app)" --root "$PWD/vk" --accept-licenses --default-answer --confirm-command install >/dev/null 2>&1 || true
      - name: vkd3d-proton
        run: |
          u=$(curl -sSL https://api.github.com/repos/HansKristian-Work/vkd3d-proton/releases/latest | grep -o 'https://[^"]*\.tar\.zst' | head -1)
          echo "$u"; curl -sSL -o v.tar.zst "$u" && mkdir v && tar --zstd -xf v.tar.zst -C v --strip-components 1
          ls v v/x64
      - name: Empaquetar
        run: |
          o=dx12-prueba; mkdir -p $o/kk $o/vk $o/vkd3d-proton
          cp x86/lib/libvulkan_kosmickrisp.dylib $o/kk/
          install_name_tool -id @loader_path/libvulkan_kosmickrisp.dylib $o/kk/libvulkan_kosmickrisp.dylib
          printf '{"file_format_version":"1.0.1","ICD":{"library_path":"./libvulkan_kosmickrisp.dylib","api_version":"1.4.0"}}\n' > $o/kk/kosmickrisp_icd.json
          L=$(ls vk/macOS/lib/libvulkan.1.*.dylib | head -1)
          lipo "$L" -thin x86_64 -output $o/vk/libvulkan.1.dylib
          cp $o/vk/libvulkan.1.dylib $o/vk/libMoltenVK.dylib    # (Wine abre «libMoltenVK.dylib»: acá es el cargador)
          lipo vk/macOS/bin/vulkaninfo -thin x86_64 -output $o/vk/vulkaninfo 2>/dev/null || cp vk/macOS/bin/vulkaninfo $o/vk/
          install_name_tool -add_rpath @loader_path $o/vk/vulkaninfo 2>/dev/null || true
          cp v/x64/d3d12.dll v/x64/d3d12core.dll $o/vkd3d-proton/
          x86_64-w64-mingw32-gcc -O2 -Wall -o $o/prueba_d3d12.exe vrmin/mac/dx12/prueba_d3d12.c -ld3d12 -ldxgi -ld3dcompiler -luuid -lm
          cp vrmin/mac/dx12/probar.sh $o/ && cp kk-version $o/
          find $o -name '*.dylib' -o -name vulkaninfo | xargs -I{} sh -c 'lipo -info "{}"; codesign --force --sign - "{}"'
          tar -czf dx12-prueba.tar.gz $o && ls -la dx12-prueba.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: dx12-prueba, path: dx12-prueba.tar.gz, retention-days: 14 }
